<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="eqGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#eqGrad)" />
  <rect width="600" height="400" fill="url(#eqGlow)" />

  <!-- Geometrics & Stadium Goal Net Texture -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <pattern id="net" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="30" height="30" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="600" height="400" fill="url(#net)" />
  </g>

  <!-- Equipment Icons (Ball, Cones, Whistle, Stopwatch) -->
  <g transform="translate(180, 80)" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.7))">
    <!-- Main Center Official Match Ball -->
    <circle cx="120" cy="120" r="85" fill="#f8fafc" stroke="#334155" stroke-width="3" />
    <!-- Pentagons -->
    <polygon points="120,70 148,90 137,125 103,125 92,90" fill="#0f172a" />
    <polygon points="70,140 92,160 80,195 50,195 40,160" fill="#0f172a" />
    <polygon points="170,140 150,160 160,195 190,195 200,160" fill="#0f172a" />
    <!-- Connecting Seams -->
    <line x1="120" y1="70" x2="120" y2="35" stroke="#334155" stroke-width="3" />
    <line x1="148" y1="90" x2="185" y2="80" stroke="#334155" stroke-width="3" />
    <line x1="137" y1="125" x2="160" y2="150" stroke="#334155" stroke-width="3" />
    <line x1="103" y1="125" x2="80" y2="150" stroke="#334155" stroke-width="3" />
    <line x1="92" y1="90" x2="55" y2="80" stroke="#334155" stroke-width="3" />

    <!-- Agility Cone Icon -->
    <polygon points="20,200 45,130 55,130 80,200" fill="#ff5500" opacity="0.9" />
    <rect x="10" y="200" width="80" height="10" rx="3" fill="#ff5500" />
    <rect x="35" y="155" width="30" height="15" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Modern Badge Pill -->
  <g transform="translate(230, 310)">
    <rect width="140" height="30" rx="15" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="70" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1.5">PRO EQUIPMENT</text>
  </g>
</svg>
