<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="shoeGlow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#shoeGrad)" />
  <rect width="600" height="400" fill="url(#shoeGlow)" />

  <!-- Diagonal Aerodynamic Speed Stripes -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="50" y1="0" x2="250" y2="400" />
    <line x1="120" y1="0" x2="320" y2="400" />
    <line x1="190" y1="0" x2="390" y2="400" />
    <line x1="260" y1="0" x2="460" y2="400" />
    <line x1="330" y1="0" x2="530" y2="400" />
  </g>

  <!-- Football Cleat / Boot Silhouette -->
  <g transform="translate(140, 110)" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))">
    <!-- Boot Body -->
    <path d="M 40,110 C 60,60 110,40 140,70 L 190,85 C 240,95 290,120 310,140 C 320,150 300,165 270,165 L 60,165 C 35,165 25,140 40,110 Z" 
          fill="url(#bootGrad)" />
    <!-- Cleat Studs / Soleplate -->
    <path d="M 50,165 L 280,165 L 270,178 L 60,178 Z" fill="#0f172a" />
    <!-- Studs -->
    <polygon points="75,178 85,178 80,195" fill="#f59e0b" />
    <polygon points="115,178 125,178 120,195" fill="#f59e0b" />
    <polygon points="155,178 165,178 160,195" fill="#f59e0b" />
    <polygon points="220,178 230,178 225,195" fill="#f59e0b" />
    <polygon points="255,178 265,178 260,195" fill="#f59e0b" />

    <!-- Swoosh / Dynamic Wave Stripe -->
    <path d="M 80,120 Q 150,90 240,130 Q 160,120 100,150 Z" fill="#ffffff" opacity="0.95" />
    <!-- Laces Details -->
    <line x1="145" y1="75" x2="165" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="155" y1="88" x2="175" y2="98" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="165" y1="101" x2="185" y2="111" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(225, 315)">
    <rect width="150" height="30" rx="15" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="75" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">CLEATS &amp; GEAR</text>
  </g>
</svg>
