<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="otherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="otherGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#otherGrad)" />
  <rect width="600" height="400" fill="url(#otherGlow)" />

  <!-- Speed Lines & Dynamic Court Markings -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <ellipse cx="300" cy="200" rx="220" ry="120" fill="none" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="150" y1="0" x2="450" y2="400" />
  </g>

  <!-- Basketball / Sleeveless Jersey Silhouette -->
  <g transform="translate(195, 55)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))">
    <path d="M 60,20 L 30,55 L 45,95 L 60,80 L 60,250 L 150,250 L 150,80 L 165,95 L 180,55 L 150,20 C 130,50 80,50 60,20 Z" 
          fill="url(#vestGrad)" stroke="#818cf8" stroke-width="2" />
    <!-- Armhole & Neck Trim -->
    <path d="M 60,20 C 80,50 130,50 150,20 C 135,60 75,60 60,20 Z" fill="#ff5500" />
    
    <!-- Graphic Elements -->
    <text x="105" y="175" font-family="'Barlow Condensed', Impact, sans-serif" font-size="75" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">23</text>
    <text x="105" y="105" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#818cf8" text-anchor="middle" letter-spacing="3">SPORT</text>
  </g>

  <!-- Basketball Seam Motif -->
  <g transform="translate(70, 200) scale(0.6)" opacity="0.2">
    <circle cx="100" cy="100" r="70" fill="none" stroke="#ff5500" stroke-width="5" />
    <line x1="30" y1="100" x2="170" y2="100" stroke="#ff5500" stroke-width="5" />
    <path d="M 55,50 Q 100,100 55,150" fill="none" stroke="#ff5500" stroke-width="5" />
    <path d="M 145,50 Q 100,100 145,150" fill="none" stroke="#ff5500" stroke-width="5" />
  </g>
</svg>
